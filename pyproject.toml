[project]
name = "lynceus-sec"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
lynceus = "lynceus_sec.cli:app"

[dependency-groups]
dev = [
    "mcp<2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynceus_sec"]
