[project]
name = "mcpval"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml"]

[dependency-groups]
dev = [
    "mcp<2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpval"]
