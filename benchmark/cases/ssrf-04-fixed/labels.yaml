case: ssrf-04-fixed
vulnerabilities: []
notes: "Se exige esquema http/https, host con IP pública resuelta en el momento del check y se bloquean redirecciones con un opener propio; el opener vuelve a resolver el host por nombre al conectar, por lo que un atacante con control de DNS podría cambiar la IP tras el check (DNS rebinding), salvo que la petición se haga contra la IP ya comprobada. Solo comprueba la IP IPv4; no cubre registros IPv6."
