name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv (versión fijada)
        run: python -m pip install "uv==0.13.4"

      - name: Cachear descargas de uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Instalar dependencias desde uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Tests
        run: uv run pytest -q
